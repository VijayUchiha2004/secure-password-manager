<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <h1>Password Manager</h1>
        
        <div class="search-filter">
            <div class="input-box">
                <input type="text" id="searchInput" placeholder="Search by website...">
                <i class='bx bx-search'></i>
            </div>
            <select id="categoryFilter" class="input-box" title="Filter by Category" aria-label="Filter by Category">
                <option value="">All Categories</option>
                <option value="social">Social Media</option>
                <option value="email">Email</option>
                <option value="banking">Banking</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="add-password-form">
            <h2>Add New Password</h2>
            <form id="addPasswordForm">
                <div class="input-box">
                    <input type="text" id="website" placeholder="Website" required>
                    <i class='bx bx-globe'></i>
                </div>
                <div class="input-box">
                    <input type="text" id="username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                    <i class='bx bx-show toggle-password'></i>
                </div>
                <div class="password-strength"></div>
                <div class="password-options">
                    <button type="button" id="generatePassword" class="btn-secondary">Generate Password</button>
                    <select id="passwordLength" class="input-box" title="Password Length" aria-label="Password Length">
                        <option value="12">12 characters</option>
                        <option value="16" selected>16 characters</option>
                        <option value="20">20 characters</option>
                        <option value="24">24 characters</option>
                    </select>
                </div>
                <div class="input-box">
                    <select id="category" required title="Category" aria-label="Category">
                        <option value="">Select Category</option>
                        <option value="social">Social Media</option>
                        <option value="email">Email</option>
                        <option value="banking">Banking</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-box">
                    <textarea id="notes" placeholder="Notes (optional)"></textarea>
                </div>
                <button type="submit" class="btn">Add Password</button>
            </form>
        </div>

        <div class="passwords-list">
            <h2>Saved Passwords</h2>
            <div id="passwordsList">
                </div>
        </div>
        <button id="logoutBtn" class="btn">Logout</button>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Edit Password</h2>
            <form id="editPasswordForm">
                <input type="hidden" id="editPasswordId">
                <div class="input-box">
                    <label for="editWebsite">Website or service</label>
                    <input type="text" id="editWebsite" placeholder="e.g. github.com" required>
                    <i class='bx bx-globe'></i>
                </div>
                <div class="input-box">
                    <label for="editUsername">Account username</label>
                    <input type="text" id="editUsername" placeholder="name@example.com" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <label for="editPassword">Password</label>
                    <input type="password" id="editPassword" placeholder="Enter a password" required>
                    <i class='bx bxs-lock-alt'></i>
                    <i class='bx bx-show toggle-password'></i>
                </div>
                <div class="password-strength"></div>
                <div class="input-box">
                    <select id="editCategory" required title="Category" aria-label="Category">
                        <option value="">Select Category</option>
                        <option value="social">Social Media</option>
                        <option value="email">Email</option>
                        <option value="banking">Banking</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-box">
                    <label for="editNotes">Notes <span>(optional)</span></label>
                    <textarea id="editNotes" placeholder="Add a secure note or recovery hint"></textarea>
                </div>
                <button type="submit" class="btn">Save Changes</button>
            </form>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Password History</h2>
            <ul id="historyList">
                </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
